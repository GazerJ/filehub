<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文件中转站 · 扫码上传 / 多选下载</title>
<meta name="description" content="局域网文件中转站：手机扫码上传，桌面选择文件上传，多选打包下载，文件保留 7 天。">
<link rel="icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="desktop">
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/>
        </svg>
      </span>
      <div>
        <h1>文件中转站</h1>
        <p>手机扫码上传 · 选择文件上传 · 多选打包下载 · 文件保留 7 天</p>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <main class="grid">

    <section class="card">
      <h2 class="card-title">手机扫码上传</h2>
      <p class="card-sub">手机连上与本机相同的 Wi-Fi，用相机或微信扫描下面的二维码，即可在手机上选照片、视频、文档上传。</p>

      <figure class="qr">
        <img id="qrImg" width="216" height="216" alt="手机上传二维码">
        <figcaption id="qrState">二维码加载中…</figcaption>
      </figure>

      <div class="linkrow">
        <code id="qrUrl">—</code>
        <button class="btn btn-ghost btn-sm" id="copyBtn" type="button">复制</button>
      </div>
      <p class="card-sub" id="lanHint" style="margin-top:8px"></p>

      <div class="divider"><span>或者在电脑上</span></div>

      <button class="btn btn-primary btn-block" id="pickBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14"/><path d="M5 12h14"/>
        </svg>
        选择文件上传
      </button>
      <input type="file" id="fileInput" multiple hidden>

      <div class="dropzone" id="dropzone">
        <strong>把文件拖到这里</strong>
        <span>支持一次选多个文件，Ctrl / ⌘ + V 也能粘贴截图</span>
      </div>

      <section class="queue" id="queue" hidden aria-live="polite"></section>
    </section>

    <section class="card">
      <div class="list-head">
        <div>
          <h2 class="card-title">已上传文件</h2>
          <p class="card-sub" id="listSummary">加载中…</p>
        </div>
        <button class="btn btn-ghost" id="refreshBtn" type="button">刷新</button>
      </div>

      <div class="toolbar">
        <label class="check"><input type="checkbox" id="selectAll"><span>全选</span></label>
        <span class="selinfo" id="selInfo">未选择文件</span>
        <span class="spacer"></span>
        <button class="btn" id="zipBtn" type="button" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4.5 19h15"/>
          </svg>
          打包下载
        </button>
        <button class="btn btn-danger" id="delBtn" type="button" disabled>删除</button>
      </div>

      <ul class="filelist" id="filelist"></ul>
      <p class="empty" id="empty">还没有文件。手机扫码，或点左侧“选择文件上传”。</p>
    </section>

  </main>

  <footer class="foot">
    文件在服务器上保留 7 天，到期后自动删除；下载链接在这 7 天内有效。请勿上传涉密或敏感资料。
  </footer>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
